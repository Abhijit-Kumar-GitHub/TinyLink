apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s

  # Reads vw_LinkClickSummary directly: per-link click totals would explode Prometheus cardinality
  # (one series per short code), but they are exactly what the SQL view already provides.
  - name: TinyLink SQL
    uid: tinylink-sql
    type: mssql
    url: ${GRAFANA_SQL_HOST}
    user: ${GRAFANA_SQL_USER}
    jsonData:
      database: AnalyticsServiceDb
      encrypt: "true"
      tlsSkipVerify: true
      maxOpenConns: 2
    secureJsonData:
      password: ${GRAFANA_SQL_PASSWORD}
