# Identity for the webhook listener. It may change images and roll back the app Deployments in this
# namespace, and nothing else: no Secrets, no other namespaces, no cluster-wide rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-deployer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [link-service, analytics-service, redirect-service, operator-console]
    verbs: [get, patch, update, watch]
  # rollout status/undo inspect the ReplicaSets and Pods behind each Deployment.
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-deployer
subjects:
  - kind: ServiceAccount
    name: webhook-deployer
---
# Long-lived token for the listener's kubeconfig (built by deploy/webhook/make-kubeconfig.sh).
apiVersion: v1
kind: Secret
metadata:
  name: webhook-deployer-token
  annotations:
    kubernetes.io/service-account.name: webhook-deployer
type: kubernetes.io/service-account-token
