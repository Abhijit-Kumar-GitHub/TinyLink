# Local k3d cluster (k3d cluster create ... -p "8088:80@loadbalancer").
# Short links: http://localhost:8088/<code>   Console: http://console.localhost:8088
# Grafana: http://grafana.localhost:8088
# The database is the dev SQL Server container on the host, reached as host.k3d.internal
# (it plays the role RDS plays on AWS: outside the cluster).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Must be repeated here: the base's namespace does not apply to resources generated by this overlay.
namespace: tinylink

resources:
  - ../../base

configMapGenerator:
  - name: tinylink-config
    behavior: merge
    literals:
      - Console__ShortUrlBase=http://localhost:8088/

# secrets.env is gitignored; copy secrets.env.example.
secretGenerator:
  - name: tinylink-secrets
    envs:
      - secrets.env

patches:
  - target: { kind: Ingress, name: tinylink }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: console.localhost
      - op: replace
        path: /spec/rules/1/host
        value: grafana.localhost

images:
  - name: farspawn/tinylink-link
    newTag: k3d-local
  - name: farspawn/tinylink-analytics
    newTag: k3d-local
  - name: farspawn/tinylink-redirect
    newTag: k3d-local
  - name: farspawn/tinylink-console
    newTag: k3d-local
